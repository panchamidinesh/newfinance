name: Flask CI/CD Pipeline

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'  # Updated from 3.9
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          python -m pytest tests/

  docker-build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.panchamidinesh }}
          password: ${{ secrets.pqpq_200517 }}
      - name: Build and push
        run: |
          docker build -t ${{ secrets.panchamidinesh }}/finance-tracker:latest .
          docker push ${{ secrets.pqpq_200517 }}/finance-tracker:latest

  deploy-to-render:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Render CLI
        run: curl -fsSL https://cli.render.com/install.sh | bash
      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.rnd_yjOV7nUm1jCE9m51dsbkh6Ddh68L }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          render services deploy \
            --service-id $RENDER_SERVICE_ID \
            --watch