<!DOCTYPE html>
<html>
<head><title>Edit Transaction</title></head>
<body>
    <h2>Edit Transaction</h2>
    <form method="POST">
        <select name="type">
            <option value="income" {% if txn.type == 'income' %}selected{% endif %}>Income</option>
            <option value="expense" {% if txn.type == 'expense' %}selected{% endif %}>Expense</option>
        </select>
        <input type="text" name="category" value="{{ txn.category }}" required>
        <input type="number" step="0.01" name="amount" value="{{ txn.amount }}" required>
        <input type="text" name="note" value="{{ txn.note }}">
        <button type="submit">Update</button>
    </form>
    <p><a href="{{ url_for('dashboard') }}">Back</a></p>
</body>
</html>
